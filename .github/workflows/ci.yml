name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # sqlx::query! macros validate against the committed .sqlx/ cache at compile
  # time; the live DATABASE_URL is only used at test runtime by #[sqlx::test].
  SQLX_OFFLINE: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hooksmith
          POSTGRES_PASSWORD: hooksmith
          POSTGRES_DB: hooksmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hooksmith"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace
        env:
          DATABASE_URL: postgres://hooksmith:hooksmith@localhost/hooksmith

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings
        env:
          SQLX_OFFLINE: true
