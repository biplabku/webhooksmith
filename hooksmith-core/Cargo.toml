[package]
name = "hooksmith"
description = "Production-grade webhook delivery engine with transactional outbox, HMAC signing, and dead letter queue"
keywords = ["webhook", "outbox", "delivery", "postgres", "async"]
categories = ["web-programming", "asynchronous", "database"]
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = "0.6"
futures = "0.3"
tracing-subscriber = { workspace = true }
axum = { workspace = true }
hooksmith-axum = { path = "../hooksmith-axum" }

