[package]
name = "webhooksmith-actix"
description = "Actix-web integration for webhooksmith — verified webhook extractor for incoming webhooks"
keywords = ["webhook", "actix-web", "hmac", "verification", "middleware"]
categories = ["web-programming", "asynchronous"]
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
webhooksmith = { version = "0.1", path = "../webhooksmith" }
actix-web = "4"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
actix-rt = "2"
tokio = { workspace = true }
serde_json = { workspace = true }
